name: Project checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run check
      - name: Check bundle size budgets
        run: npm run check:budgets
      - run: npm test
  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Check Firestore isolation with emulator
        run: npx --yes --package firebase-tools@15.32.1 firebase emulators:exec --only firestore --project demo-play-your-life "node --experimental-strip-types --test tests/firebase-rules.test.mjs"
      - name: Show emulator details on failure
        if: failure()
        run: tail -n 120 firestore-debug.log

  quests-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify homepage month focus and yearly summary (local fixture only)
        run: node --experimental-strip-types --no-warnings tests/home-ui.mjs
      - run: npm run test:quests-ui
      - run: npm run test:tasks-calendar
      - run: npm run test:goals-ui
      - run: npm run test:theme-ui
      - run: npm run test:spheres-ui
      - name: Verify account TickTick settings with isolated mock services
        run: node tests/ticktick-ui.mjs
      - name: Verify TickTick inbox and two-way sync flow in the browser (mock services)
        run: node tests/ticktick-flow-ui.mjs
      - run: npm run build
      - run: node tests/logo-ui.mjs
      - name: Save mobile and desktop previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quests-previews
          path: |
            work/quests-*.png
            work/logo-*.png
            work/goal-redesign/*.png
            work/ticktick/*.png
            work/theme/*.png
            work/spheres/*.png

  live-city-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:live-city
      - name: Save live city mobile and desktop previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-city-previews
          path: work/live-city/

  sections-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Walk through every section on desktop and phone (no errors, no blank screens)
        run: npm run test:smoke-ui
      - run: npm run test:key-results-ui
      - run: npm run test:month-report-ui
      - name: Save section previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sections-previews
          path: |
            work/smoke/
            work/key-results/
            work/month-report/
