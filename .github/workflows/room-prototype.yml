name: Verify 3D sport prototype
on:
  push:
    branches: [room/3d-sport]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: room/3d-sport
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Resolve and preserve npm lock
        run: |
          npm install --package-lock-only --no-audit --no-fund
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Закрепить зависимости 3D Room Engine"
            git push origin HEAD:room/3d-sport
          fi
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Verify WebGL, economy and placement in browser
        run: node --experimental-strip-types scripts/room-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sport-3d-preview
          path: room-preview/
          if-no-files-found: ignore
