# Временный: снимки логотипа для проверки в облаке. Удаляется перед слиянием.
name: Theme previews
on:
  push:
    branches: [feat/logo-transparent]
permissions:
  contents: write
jobs:
  previews:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Logo
        run: |
          set +e
          npm run build > out.log 2>&1
          cat > shot.mjs <<'JS'
          import { chromium } from 'playwright';
          import { spawn } from 'node:child_process';
          const s = spawn(process.execPath, ['node_modules/vite/bin/vite.js', 'preview', '--host', '127.0.0.1', '--port', '5199', '--strictPort']);
          await new Promise(r => setTimeout(r, 4000));
          const b = await chromium.launch();
          for (const theme of ['dark', 'light']) for (const [w, h] of [[1440, 900], [390, 844]]) {
            const p = await b.newPage({ viewport: { width: w, height: h } });
            await p.goto('http://127.0.0.1:5199/play-your-life/').catch(() => p.goto('http://127.0.0.1:5199/'));
            await p.evaluate(t => localStorage.setItem('play-your-life-home-theme', t), theme);
            await p.reload(); await p.waitForTimeout(1500);
            await p.screenshot({ path: `shots/${theme}-${w}.png` });
          }
          await b.close(); s.kill();
          JS
          mkdir -p shots && node shot.mjs >> out.log 2>&1; code=$?
          node tests/logo-ui.mjs >> out.log 2>&1 || code=1
          tail -c 3000 out.log | tr '\n' ' ' | sed 's/^/::error::/'; echo
          mkdir -p out && cp -r shots out/ && cp out.log out/
          cd out && git init -q && git checkout -q -b theme-previews && git add -A && git -c user.name=ci -c user.email=ci@example.com commit -qm "previews ${GITHUB_SHA}" && git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" theme-previews
          exit $code
