# Временный: снимки темы для проверки в облаке. Удаляется перед слиянием.
name: Theme previews
on:
  push:
    branches: [feat/home-quick-actions]
permissions:
  contents: write
jobs:
  previews:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Theme UI
        run: |
          set +e
          npm run test:theme-ui > theme.log 2>&1; code=$?
          tail -c 3000 theme.log | tr '\n' ' ' | sed 's/^/::error::/'; echo
          mkdir -p out && cp -r work/theme out/ 2>/dev/null; cp theme.log out/
          cd out && git init -q && git checkout -q -b theme-previews && git add -A && git -c user.name=ci -c user.email=ci@example.com commit -qm "previews ${GITHUB_SHA}" && git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" theme-previews
          exit $code
