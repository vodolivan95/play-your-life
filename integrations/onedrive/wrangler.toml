name = "play-your-life-onedrive"
main = "worker.ts"
compatibility_date = "2026-10-08"
compatibility_flags = ["nodejs_compat"]

[vars]
APP_URL = "https://vodolivan95.github.io/play-your-life/"
FIREBASE_PROJECT_ID = "play-your-life-872b1"
MICROSOFT_TENANT = "consumers"
# Set BRIDGE_URL to the deployed HTTPS origin, no trailing slash.

[[durable_objects.bindings]]
name = "ACCOUNTS"
class_name = "OneDriveAccount"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["OneDriveAccount"]
